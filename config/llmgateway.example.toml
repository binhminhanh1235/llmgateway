[server]
host = "127.0.0.1"
port = 7331

[api]
key_env = "LLMGATEWAY_API_KEY"
default_model = "llmgateway-auto"

[storage]
database_url = "sqlite://data/llmgateway.db"

# Context is compiled before persistent-thread requests are sent upstream.
# Full transcripts remain in SQLite; checkpoints only replace older turns in the model input.
[context]
enabled = true
target_tokens = 16000
reserve_output_tokens = 4000
recent_messages = 12
compaction_trigger_ratio = 0.85
summary_input_tokens = 12000
summary_max_tokens = 1200
# summary_model = "llmgateway-auto" # optional; defaults to the thread/requested model

# Relevant excerpts are retrieved only from transcript history already represented by a checkpoint.
retrieval_enabled = true
retrieval_max_chunks = 3
retrieval_max_tokens = 2400
retrieval_min_score = 0.35

# "local" is zero-config and uses the v0.7 lexical/phrase scorer.
# "hybrid" adds OpenAI-compatible embeddings as a semantic reranker and falls back to local
# retrieval in the same request if embedding credentials, quota, transport, or response fail.
retrieval_backend = "local"
# retrieval_embedding_account = "openrouter-main"
# retrieval_embedding_model = "openai/text-embedding-3-small"
retrieval_semantic_weight = 0.70
retrieval_min_similarity = 0.15
retrieval_embedding_batch_size = 64

# Providers describe protocols/endpoints. models_path is used by model discovery.
[[providers]]
id = "openrouter"
kind = "openai-compatible"
base_url = "https://openrouter.ai/api/v1"
models_path = "models"

[[providers]]
id = "gemini"
kind = "openai-compatible"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
models_path = "models"

[[providers]]
id = "qwen"
kind = "openai-compatible"
base_url = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
models_path = "models"

# Accounts are credential/quota domains. Each account gets its own discovered model availability.
[[accounts]]
id = "openrouter-main"
provider = "openrouter"
api_key_env = "OPENROUTER_API_KEY"
auth_style = "bearer"
enabled = true
discover_models = true

[[accounts]]
id = "gemini-primary"
provider = "gemini"
api_key_env = "GEMINI_API_KEY_PRIMARY"
auth_style = "bearer"
enabled = true
discover_models = true

[[accounts]]
id = "gemini-secondary"
provider = "gemini"
api_key_env = "GEMINI_API_KEY_SECONDARY"
auth_style = "bearer"
enabled = true
discover_models = true

[[accounts]]
id = "qwen-primary"
provider = "qwen"
api_key_env = "QWEN_API_KEY"
auth_style = "bearer"
enabled = true
discover_models = true

# Routes are explicit preferred bindings. Discovered account/model pairs can also be used dynamically.
[[routes]]
id = "gemini-primary"
account = "gemini-primary"
model = "gemini-3.7-flash"
priority = 10
enabled = true
capabilities = ["chat", "tools", "vision", "coding"]

[[routes]]
id = "gemini-secondary"
account = "gemini-secondary"
model = "gemini-3.7-flash"
priority = 20
enabled = true
capabilities = ["chat", "tools", "vision", "coding"]

[[routes]]
id = "qwen-coder"
account = "qwen-primary"
model = "qwen3-coder-plus"
priority = 10
enabled = true
capabilities = ["chat", "tools", "coding"]

[[routes]]
id = "openrouter-fallback"
account = "openrouter-main"
model = "anthropic/claude-sonnet-4.6"
priority = 100
enabled = true
capabilities = ["chat", "tools", "coding"]

[virtual_models.llmgateway-auto]
routes = ["gemini-primary", "gemini-secondary", "qwen-coder", "openrouter-fallback"]

[virtual_models.llmgateway-coding]
routes = ["qwen-coder", "gemini-primary", "gemini-secondary", "openrouter-fallback"]

[virtual_models.llmgateway-best]
routes = ["openrouter-fallback", "gemini-primary", "qwen-coder"]

# Claude Code can keep asking for its normal model names; aliases map them to policies.
[[aliases]]
pattern = "claude-sonnet-*"
target = "llmgateway-coding"

[[aliases]]
pattern = "claude-opus-*"
target = "llmgateway-best"

[[aliases]]
pattern = "claude-haiku-*"
target = "llmgateway-auto"
