name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: node --check ui/app.js
      - run: node --check ui/account-control.js
      - run: node --check ui/account-intelligence.js
      - run: node --check ui/browser-control.js
      - run: node --check ui/trace-console.js
      - run: node --check adapters/gemini-web.js
      - run: node --check adapters/chatgpt-web.js
      - run: node --check adapters/qwen-web.js
      - run: node scripts/test-browser-adapter-fixtures.mjs
      - run: bash -n scripts/live-browserless-acceptance.sh
      - run: bash -n scripts/live-gemini-model-selection.sh
      - run: bash -n scripts/live-qwen-browserless-acceptance.sh
      - run: bash -n scripts/smoke-gemini-recovery.sh
      - run: RUSTFLAGS="-D warnings" cargo check --all-targets
      - run: cargo clippy --all-targets
      - run: cargo test --all-targets
      - run: bash scripts/smoke-provider-conversation-affinity.sh
      - run: bash scripts/smoke-gemini-recovery.sh
      - run: bash scripts/smoke-chatgpt-browser.sh
      - run: bash scripts/smoke-local.sh
      - run: bash scripts/smoke-openai-sdk.sh
      - run: bash scripts/smoke-hybrid.sh
      - run: bash scripts/smoke-memory.sh
      - run: bash scripts/smoke-quota.sh
      - run: bash scripts/smoke-browser-session.sh
      - run: bash scripts/smoke-chromium-driver.sh
      - run: bash scripts/smoke-browser-account-ux.sh
      - run: bash scripts/smoke-browser-streaming.sh
      - run: bash scripts/smoke-browser-provider.sh
      - run: bash scripts/smoke-first-class-browser-account.sh
      - run: bash scripts/smoke-browser-reliability.sh
      - run: bash scripts/smoke-browser-routing-intelligence.sh
      - run: bash scripts/smoke-account-intelligence.sh
      - run: bash scripts/smoke-routing-trace.sh
      - run: bash scripts/smoke-execution-trace.sh
      - run: bash scripts/smoke-adaptive-routing.sh
      - run: bash scripts/smoke-task-aware-routing.sh
      - run: bash scripts/smoke-client-policies.sh
      - run: docker build -t llmgateway:ci .

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate live browserless PowerShell runner
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/live-browserless-acceptance.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/live-gemini-model-selection.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - run: cargo check --all-targets
      - run: cargo test --all-targets
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/smoke-chromium-driver-windows.ps1
