name: P3 reconcile conflict report

on:
  push:
    branches:
      - feat/multimodal-gateway
    paths:
      - .github/workflows/p3-reconcile-report.yml

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main without committing
        shell: bash
        run: |
          set +e
          git config user.name "llmgateway-reconcile"
          git config user.email "llmgateway-reconcile@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff --no-commit origin/main
          merge_rc=$?
          echo "merge_rc=$merge_rc"
          echo "=== UNMERGED FILES ==="
          git diff --name-only --diff-filter=U
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          files=subprocess.check_output(["git","diff","--name-only","--diff-filter=U"], text=True).splitlines()
          for f in files:
              print(f"===== {f} =====")
              lines=Path(f).read_text().splitlines()
              i=0
              block=0
              while i < len(lines):
                  if lines[i].startswith("<<<<<<<"):
                      block += 1
                      start=max(0,i-18)
                      j=i
                      while j < len(lines) and not lines[j].startswith(">>>>>>>"):
                          j += 1
                      end=min(len(lines),j+19)
                      print(f"--- conflict {block}, lines {i+1}-{j+1} ---")
                      for n in range(start,end):
                          print(f"{n+1:5}: {lines[n]}")
                      i=j
                  i += 1
          PY
          exit 0
